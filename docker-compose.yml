services:

  postgres:
    image: postgres:16
    container_name: sms_gateway_postgres

    environment:
      POSTGRES_DB: sms_gateway_analytics
      POSTGRES_USER: analytics_user
      POSTGRES_PASSWORD: analytics_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: